
name: Build Ridwan Remote Control

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Create temporary Firebase configs
        run: |
          for app in master client; do
            package="com.ridwan.${app}"
            mkdir -p "$app/app"
            cat > "$app/app/google-services.json" <<EOF
          {
            "project_info": {
              "project_number": "123456789",
              "project_id": "demo-project",
              "storage_bucket": "demo-project.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789:android:abcdef",
                "android_client_info": {
                  "package_name": "$package"
                }
              },
              "api_key": [{
                "current_key": "demo-key"
              }]
            }],
            "configuration_version": "1"
          }
          EOF
          done

      - name: Build Master APK
        working-directory: master
        run: gradle assembleDebug --stacktrace

      - name: Build Client APK
        working-directory: client
        run: gradle assembleDebug --stacktrace

      - name: Upload Master APK
        uses: actions/upload-artifact@v4
        with:
          name: Ridwan-Master-APK
          path: master/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Client APK
        uses: actions/upload-artifact@v4
        with:
          name: Ridwan-Client-APK
          path: client/app/build/outputs/apk/debug/app-debug.apk
