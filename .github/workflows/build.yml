
name: Build Ridwan Remote Control

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create temporary Firebase config
        run: |
          mkdir -p master/app
          mkdir -p client/app
          echo '{"project_info":{"project_number":"123456789","project_id":"demo-project","storage_bucket":"demo-project.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789:android:abcdef","android_client_info":{"package_name":"com.ridwan.master"}},"api_key":[{"current_key":"demo-key"}]}],"configuration_version":"1"}' > master/app/google-services.json
          echo '{"project_info":{"project_number":"123456789","project_id":"demo-project","storage_bucket":"demo-project.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789:android:abcdef","android_client_info":{"package_name":"com.ridwan.client"}},"api_key":[{"current_key":"demo-key"}]}],"configuration_version":"1"}' > client/app/google-services.json

      - name: Build Master APK
        run: gradle -p master assembleDebug

      - name: Build Client APK
        run: gradle -p client assembleDebug

      - name: Upload Master APK
        uses: actions/upload-artifact@v4
        with:
          name: Ridwan-Master-APK
          path: master/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Client APK
        uses: actions/upload-artifact@v4
        with:
          name: Ridwan-Client-APK
          path: client/app/build/outputs/apk/debug/app-debug.apk
